upstream platform {
    server 127.0.0.1:3100;
}

server {
    listen 80;

    # Dashboard static files
    location / {
        root /var/www/dashboard;
        try_files $uri /index.html;
    }

    # Platform admin API
    location /api/ {
        proxy_pass http://platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket for Platform notifications
    location /ws {
        proxy_pass http://platform;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Worker reverse proxy (dynamic port resolved from Platform)
    location ~ ^/w/([a-f0-9-]+)/(.*) {
        set $worker_uid $1;

        auth_request /internal/resolve-worker;
        auth_request_set $worker_port $upstream_http_x_worker_port;

        proxy_pass http://127.0.0.1:$worker_port/$2$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_set_header Connection "";
    }

    location = /internal/resolve-worker {
        internal;
        proxy_pass http://platform/api/worker/resolve?uid=$worker_uid;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
}
